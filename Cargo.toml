[package]
name = "scriptherder"
version = "0.1.0"
edition = "2021"

[lib]
name = "scriptherder"
path = "src/lib.rs"

[[bin]]
name = "scriptherder"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rust-ini = "0.21"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
syslog = "6"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
thiserror = "2"
rand = "0.8"
